function guard(fn){if(!dirty){fn();return}pendingNav=fn;modal('有未保存的修改',`<p>离开前如何处理当前表单？</p><p class="muted mt">这是未保存保护的交互演示。</p>`,`${button('放弃修改',"finishGuard(false)")}${button('留在当前页',"closeDialog()")}${button('保存后继续',"finishGuard(true)",'primary')}`)}

function go(next,sub){guard(()=>{page=next;if(sub)setting=sub;query='';filter='all';render();window.scrollTo(0,0)})}
function toggleTheme(){document.body.classList.toggle('dark');$('themeBtn').textContent=document.body.classList.contains('dark')?'浅色':'深色'}

function modal(title,body,foot='',drawer=false){const d=$('dlg');if(d.open)d.close();d.className=drawer?'drawer':'';$('dialogContent').innerHTML=`<div class="dialog-head"><div><h2 id="dialogTitle">${title}</h2><div class="small muted">HTC · 示例预览</div></div><button aria-label="关闭" onclick="closeDialog()">✕</button></div><div class="dialog-body">${body}</div><div class="dialog-foot">${foot||button('关闭',"closeDialog()")}</div>`;d.setAttribute('aria-labelledby','dialogTitle');d.showModal()}

function coverage(){modal('预览导览',`<p>先看排版与操作路径，再逐页调整。这份 v0 覆盖 10 个一级入口和 12 个设置分区。</p><div class="notice mt"><div><strong>推荐先体验</strong><p>自动上架 → 蓝色收纳盒“去处理” → 颜色填写 Blue → 保存并重新检查 → 返回原任务。</p></div></div><div class="coverage-grid mt">${navItems.map(n=>button(n[1],`closeDialog();go('${n[0]}')`)).join('')}</div><p class="small muted mt">导航、筛选、详情、主题、密度和主要弹窗可体验。同步、生成、上传、发布、恢复等只演示反馈；数据不持久保存，刷新重置。</p>`,button('从异常处理开始',"closeDialog();go('automatic')",'primary'))}
function render(){document.title=`${navItems.find(n=>n[0]===page)?.[1]} · HTC 界面预览`;$('crumb').textContent=navItems.find(n=>n[0]===page)?.[1];$('nav').innerHTML=navItems.map((n,i)=>`${i===0?'<div class="nav-label">工作空间</div>':i===7?'<div class="nav-label">管理</div>':''}<button class="navbtn ${page===n[0]?'active':''}" ${page===n[0]?'aria-current="page"':''} onclick="go('${n[0]}')">${icon(n[2])}<span>${n[1]}</span><span class="n">${n[3]}</span></button>`).join('');const views={automatic:automaticView,inbox:inboxView,manual:manualView,results:resultsView,data:dataView,procurement:procurementView,shipping:shippingView,catalog:catalogView,audit:auditView,settings:settingsView};$('main').innerHTML=views[page]()+`<p class="footer-note">预览 v0 · 全部商品、金额、状态与调用均为虚构示例 · 请优先反馈布局、信息层级与操作路径</p>`}
function status(i){const s=statuses[i];return s==='done'?pill('流程完成','good'):s==='running'?pill(taskPaused?'已暂停 · 保留进度':'处理中','info'):s==='wait'?pill('等待继续','warn'):pill('需要处理','bad')}
function reason(i){if(statuses[i]!=='issue')return statuses[i]==='done'?'成果已保留':statuses[i]==='wait'?'已检查，等待继续':taskPaused?'任务已暂停，原步骤保留':'正在准备图片';return i===0?'颜色值不在允许选项内':i===4?'第 3 张图片下载失败':'提交结果未知，需核对原请求'}
function setFilter(s){filter=s;expanded=new Set([0,1,2,3]);render()}
function automaticView(){const counts={done:statuses.filter(s=>s==='done').length,running:statuses.filter(s=>s==='running').length,wait:statuses.filter(s=>s==='wait').length,issue:statuses.filter(s=>s==='issue').length};return head('自动上架','按商品链接组织，按销售 SKU 查看结果。',button('商品与定价设置',"go('settings','pricing')")+button('刷新本机记录',"notify('已刷新示例记录；未请求外部服务。')"))+`<div class="tabs">${button('待启动商品 · 4',"autoTab='queue';render()",autoTab==='queue'?'active':'')}${button('任务记录 · 1',"autoTab='tasks';render()",autoTab==='tasks'?'active':'')}</div>`+(autoTab==='queue'?queueView():`<section class="panel mb"><div class="panel-head"><div><div class="row"><h2>午后上新 · 10 月 13 日</h2>${pill(taskPaused?'已暂停':'运行中',taskPaused?'warn':'info')}</div><div class="small muted mt" style="margin-top:6px">美国店铺 A · 美国站 · 4 个商品链接 / 12 个来源规格 / 12 个销售 SKU</div></div><div class="row">${button(taskPaused?'继续任务':'暂停任务',"toggleTask()",'primary')}${button('取消任务',"cancelTask()",'quiet')}</div></div><div class="panel-body"><div class="row between"><span><strong>${counts.done} / 12</strong> 个销售 SKU 流程完成</span><span class="small muted">示例更新时间 13:42 · 离开页面不会停止后台任务</span></div><div class="progress-track"><i style="width:${counts.done/12*100}%"></i></div><div class="stepbar">${['资料与规格','类目与规则','定价与配方','文案与字段','七图处理','校验与提交','结果回读'].map((s,i)=>`<button class="step ${i<3?'done':''} ${selectedStep===i?'current':''}" onclick="selectedStep=${i};render()"><span class="stepnum">${i<3?'✓':i+1}</span>${s}<small>${i<3?'已有结果':i===3?(statuses[0]==='issue'?'1 项字段待处理':'字段已检查，等待继续'):i===4?'1 项下载待处理':i===5?'1 项结果待核对':'按提交结果跟进'}</small></button>`).join('')}</div><div class="stage-detail">${['资料已固定为本次任务快照。','已取得当前类目规则；按销售 SKU 保留结果。','实际报价依据已记录，可从 SKU 详情查看。',(statuses[0]==='issue'?'蓝色收纳盒的颜色选项需要调整；其他 SKU 的成功内容保留。':'蓝色收纳盒已通过字段检查，等待明确继续；其他成果保留。'),'成功图位保留，仅继续缺失的下载步骤。','结果未知的提交先核对原请求，不提供普通重发。','提交接受与回读可售分别记录。'][selectedStep]}</div></div></section><div class="statbar">${[['all','销售 SKU 总数',12,''],['running',taskPaused?'暂停中':'处理中',counts.running,''],['wait','等待继续',counts.wait,''],['issue','需要处理',counts.issue,'bad'],['done','流程完成',counts.done,'good']].map(([k,t,n,c])=>`<button class="stat ${c} ${filter===k?'active':''}" onclick="setFilter('${k}')"><span>${t}</span><strong class="num">${n}</strong></button>`).join('')}</div>${counts.issue?note(`${counts.issue} 个 SKU 需要处理，已完成的结果继续保留`,'字段问题、图片下载和未知提交分别处理。点击商品行中的对应入口。','warn'):note('字段修改已通过示例检查','可以返回任务继续；其他异常仍按各自处理入口核对。','good')}<section class="panel mt"><div class="toolbar"><h2 class="grow">商品与销售 SKU</h2><input class="search" placeholder="搜索商品、SKU 或原因" value="${esc(query)}" oninput="query=this.value;renderGroups()" aria-label="搜索任务商品">${button('展开全部',"expanded=new Set([0,1,2,3]);renderGroups()",'quiet')}</div><div id="groups">${groupsHTML()}</div><div class="panel-foot">显示范围：${filter==='all'?'全部销售 SKU':filter==='issue'?'需要处理':filter==='done'?'流程完成':filter==='wait'?'等待继续':'处理中/暂停中'} · 点击数量可筛选；统计不混入未选中或规则筛除项</div></section>`)}
function groupsHTML(){const out=products.map((p,pi)=>{const ids=p.specs.map((_,j)=>pi*3+j).filter(i=>(filter==='all'||statuses[i]===filter)&&`${p.name} ${p.code} ${p.specs[i%3]} ${reason(i)}`.toLowerCase().includes(query.toLowerCase()));if(!ids.length)return '';return `<div class="group"><button class="group-title" aria-expanded="${expanded.has(pi)}" onclick="toggleGroup(${pi})"><span class="row">${thumb(p)}<span><strong>${p.name}</strong><br><small>来源编号 ${p.code} · 3 个规格 · ${ids.length} 个匹配销售 SKU</small></span></span><span>${expanded.has(pi)?'⌃':'⌄'}</span></button>${expanded.has(pi)?table(['销售 SKU / 规格','当前阶段','状态','原因 / 下一步','操作'],ids.map(i=>`<tr><td><span class="mono">HTC-US-${p.code}-${i%3+1}</span><small>${p.specs[i%3]}</small></td><td>${i===0?'文案与字段':i===4?'七图处理':i===11?'校验与提交':statuses[i]==='done'?'结果已保存':'图片处理'}</td><td>${status(i)}</td><td style="max-width:260px;font-size:13px">${statuses[i]==='issue'?'<span class="error-dot"></span>':''}${reason(i)}</td><td class="actions">${button(statuses[i]==='issue'?(i===11?'核对原提交':'去处理'):'查看详情',`openSku(${i})`,'link')}</td></tr>`).join('')):''}</div>`}).join('');return out||'<div class="empty"><strong>没有匹配的商品</strong>调整搜索词或切换筛选范围。</div>'}

function updateQueueCount(){const n=$('main').querySelectorAll('tbody input:checked').length;$('queueCount').textContent=`已选 ${n} 个商品链接 · ${n*3} 个来源规格 · 预计 ${n*3} 个销售 SKU`}

function openSku(i){currentSku=i;const p=products[Math.floor(i/3)];if(i===0&&statuses[i]==='issue'){returnPage=page;manualTab='fields';go('manual');setTimeout(()=>$('colorField')?.focus(),50);return}const unknown=i===11;modal(p.name+' · '+p.specs[i%3],`<div class="row">${status(i)}<span class="mono">HTC-US-${p.code}-${i%3+1}</span></div>${note(unknown?'提交结果未知':reason(i),unknown?'保留原操作记录，先查询原提交结果。不能直接重新发送。':'这里展示当前步骤、依据和可操作范围。',statuses[i]==='issue'?'warn':'info')}<div class="mt">${unknown?`<div class="timeline"><div><strong>13:31 请求已发送</strong><small>操作编号 PUB-DEMO-012</small></div><div><strong>13:32 响应未完整取得</strong><small>不能判断平台是否已接受</small></div><div><strong>下一步：核对原提交</strong><small>回读观察与原请求结果分开保留</small></div></div>`:`<h3>七图进度</h3><div class="imgslots mt">${slotsHTML(i===4)}</div><details class="mt"><summary>查看实际报价明细</summary>${priceHTML()}</details>`}</div>`,button('返回列表',"closeDialog()")+button(unknown?'查询原提交（演示）':i===4?'继续缺失下载（演示）':'查看草稿',unknown?"notify('已演示查询原提交，未发送任何平台请求。')":i===4?"notify('已演示续补第 3 张下载，其他成果不变。')":"closeDialog();manualTab='fields';go('manual')",'primary'),true)}

function switchSetting(k){guard(()=>{setting=k;render()})}
function switchRow(title,desc,checked=true){return `<label class="switchrow"><span><strong>${title}</strong><small>${desc}</small></span><input class="toggle" type="checkbox" ${checked?'checked':''} onchange="notify('已演示开关保存；真实设置未改变。')" aria-label="${title}"></label>`}
function settingContent(){switch(setting){case'ai':return aiSettings();case'images':return panel('图片与生图',`<div class="form-grid">${select('生成服务',['OpenAI 官方 API','旧中转接入（过渡）'])}${field('生图模型','官方图片模型（能力待接入核验）')}${select('尺寸',['使用模型支持的尺寸'])}${select('质量',['模型默认','高'])}</div><div class="mt">${button('管理模型连接',"switchSetting('ai')",'link')}</div>`)+`<div class="mt">${panel('复核与风险检测',switchRow('文案复核','检查生成文案及生图前文案，保留独立开关。')+switchRow('商品外观一致性复核','覆盖主图和详情图；常规复核与疑难自动升级按已定设置。')+switchRow('阿里云图片风险检测','独立服务，不与外观复核混为一项。'))}</div>`+savebar('保存生图配置');case'amazon':return connectionSettings('Amazon 店铺连接','美国店铺 A','卖家标识','SELLER-DEMO','保存店铺连接');case'collection':return connectionSettings('妙手采集连接','妙手示例账号','AppKey','APP-DEMO','保存妙手连接')+`<div class="mt">${panel('同步偏好',switchRow('进入采集箱自动检查','同步明细统一在采集箱查看，不在设置复制商品管理。')+button('返回采集箱',"go('inbox')",'link'))}</div>`;case'hosting':return panel('图片托管连接',`<div class="row mb">${pill('配置已保存','good')}${pill('当前选用','info')}</div><div class="form-grid">${field('配置名称','HTC 素材托管')}${field('服务器（示例）','files.example.invalid')}${field('远程目录','/listing-assets/')}${field('公开地址（示例）','https://images.example.invalid/')}</div><p class="small muted mt">配置编辑仅演示字段排版。真实地址、凭据与网络访问均不使用。</p><div class="row mt">${button('导入配置',"importConfig()")}${button('下载空白模板',"notify('此预览仅展示模板入口，不导出凭据。')")}</div>`)+savebar('保存托管配置');case'labels':return panel('商品标签格式',`<div class="form-grid">${select('标签纸类型',['A4 / Letter','热敏标签纸'])}${select('排版规格',['A4 · 21 格','A4 · 24 格','Letter · 30 格'])}${field('热敏宽度（mm）','50','number')}${field('热敏高度（mm）','30','number')}</div><p class="small muted mt">纸张类型切换后的字段显示将在详细原型中细化。默认修改用于后续准备，不悄悄改变旧文件。</p>`)+savebar('保存标签格式');case'product':return panel('商品规则',`<div class="form-grid">${field('店铺制造商映射','按已确认店铺规则')}${field('每 SKU 默认备货销售单位','10','number')}${field('内部估算尺寸（cm）','20 × 15 × 10')}${field('内部估算包装重量（g）','200','number')}</div><div class="mt">${note('估算参数只用于内部定价','不是商品事实，不自动进入对外文案或图片。')}</div><div class="checkline"><span>危险品声明</span><span>不适用 · 已确认固定规则</span></div>`)+savebar('保存商品规则');case'pricing':return pricingSettings();case'sku':return panel('SKU 命名',`<div class="form-grid">${field('模板名称','美国店铺默认')}${select('日期格式',['YYMMDD','YYYYMMDD'])}${field('父体 / 独立款模板','{店铺}-{日期}-{流水号}')}${field('子体模板','{父SKU}-{规格序号}')}${field('店铺前缀','HTC-US')}${field('流水号补零位数','4','number')}</div><div class="notice mt"><div><strong>命名预览 · 不占用号码</strong><p class="mono">HTC-US-261013-0001<br>HTC-US-261013-0001-01</p></div></div><p class="small muted mt">模板编辑实时联动将在详细原型中补齐。现有已分配 SKU 不重新命名。</p>`)+savebar('保存 SKU 命名规则');case'appearance':return panel('外观与交互',`<div class="switchrow"><span><strong>界面主题</strong><small>预览立即切换，检查相同内容的层次。</small></span>${button('切换明暗',"toggleTheme()")}</div><div class="switchrow"><span><strong>信息密度</strong><small>紧凑优先减少间距，保留核心字号。</small></span>${button('切换舒适 / 紧凑',"toggleDensity()")}</div><div class="switchrow"><span><strong>减少动态</strong><small>键盘操作与高频列表切换即时反馈。</small></span><input class="toggle" type="checkbox" ${document.body.classList.contains('reduce')?'checked':''} onchange="document.body.classList.toggle('reduce',this.checked)" aria-label="减少动态"></div>`);case'backup':return backupSettings();case'diagnostics':return panel('诊断与关于',`<div class="row mb">${button('检查本地数据',"diagnosticDemo()",'primary')}${button('导出诊断报告',"modal('导出诊断报告','<p>包含：版本、失败类型、相关操作编号及所选业务上下文。</p><p class=\"mt muted\">真实凭据不包含。示例不生成文件；具体脱敏清单在实施方案中列明。</p>')" )}</div><div id="diagnosticResult">${note('检查只读，不暗中修复','真实检查与服务访问分开。本预览展示的是示例检查项。')}</div><div class="checkline"><span>界面预览版本</span><strong>2.5.0 v0</strong></div><div class="checkline"><span>业务程序</span><span class="muted">没有启动或修改</span></div>`);default:return ''}}
function connectionSettings(title,name,key,value,save){return panel(title,`<div class="row mb">${pill('正式连接样式示例','info')}${pill('配置已保存','good')}<span class="small muted">最近检查：示例 13:00</span></div><div class="form-grid">${field('连接名称',name)}${field(key,value)}${field('密钥（预览不保存）','','password','placeholder="已配置 · 不回显" autocomplete="off"')}${select('目标范围',['美国站 / 示例账号'])}</div><div class="row mt">${button('检查连接',"notify('已演示检查反馈；未访问任何服务。')")}${button('导入授权配置',"importConfig()")}${button('暂停调用',"notify('暂停范围提示已演示；真实连接不变。')",'quiet')}${button('解除本机连接',"modal('解除本机连接？','<p>历史记录保留，不代表撤销平台端授权。此操作只演示确认。</p>',button('保留连接','closeDialog()')+button('演示解除',\"closeDialog();notify('未移除任何真实凭据。')\",'danger'))",'danger')}</div>`)+savebar(save)}
function importConfig(){modal('导入配置 · 变更摘要',`<div class="price-list"><div><span>配置用途</span><strong>当前连接分区</strong></div><div><span>将替换</span><span>示例连接</span></div><div><span>凭据</span><span>不显示具体值</span></div></div><p class="small muted mt">正式程序先检查格式和目标身份。预览不读取文件。</p>`,button('取消',"closeDialog()")+button('确认摘要（演示）',"closeDialog();notify('已演示导入确认，真实配置未变化。')",'primary'))}
function aiSettings(){return `<div class="tabs">${[['overview','HTC 用量总览'],['connection','连接与模型'],['calls','调用明细']].map(([k,t])=>button(t,`guard(()=>{aiTab='${k}';render()})`,aiTab===k?'active':'')).join('')}</div>`+(aiTab==='connection'?panel('OpenAI 连接与模型',`<div class="form-grid">${field('连接名称','OpenAI 官方')}${field('API Key（预览不保存）','','password','placeholder="已配置 · 不回显" autocomplete="off"')}</div><div class="row mt">${pill('模型角色已确认','good')}${button('检查访问',"notify('访问检查仅演示，未调用账户 API。')",'link')}</div><div class="mt">${table(['用途','模型角色（示例配置）','思考配置'],[['文案生成','GPT 6 Luna'],['常规复核','GPT 6 Luna'],['疑难复核','GPT 6.1 Sol']].map(r=>`<tr><td>${r[0]}</td><td><input aria-label="${r[0]}模型" value="${r[1]}" oninput="setDirty()"></td><td><select aria-label="${r[0]}思考配置" onchange="setDirty()"><option>模型支持的默认配置</option></select></td></tr>`).join(''))}</div><p class="small muted mt">这里只展示已确认的模型分工。实际型号权限、可选参数与价格在接入前核验，不以预览证明可用。</p>${switchRow('疑难问题自动升级','自动升级不逐次确认，原调用与升级分别记账。')}<details class="mt"><summary>阿里云与旧接入兼容区</summary><p class="muted small mt">阿里云 OCR / 风险检测独立保留。DeepSeek / 中转站在过渡完成前保留，不静默双发。</p></details>`)+savebar('保存 AI 配置'):aiTab==='calls'?panel('调用明细 · 今天',table(['时间 / 关联对象','功能 / 模型角色','请求与后续状态','用量','费用'],[['13:36 / 蓝色收纳盒','字段复核 / 常规','响应已收到，等待采用','1,240 tokens','$ 0.004（示例）'],['13:32 / 理线夹','图片生成','响应已收到，下载失败','1 张','待确认'],['13:29 / 收纳盒','疑难升级','响应已收到，已复核','2,880 tokens','$ 0.018（示例）']].map(r=>`<tr>${r.map((c,i)=>`<td>${i===2?button(c,"modal('调用阶段','<p>请求已发送 → 响应已接收 → 下载/解析 → 业务采用。</p><p class=\"mt muted\">业务未完成不等于没有消耗；恢复原响应不另算一次发送。</p>')",'link'):c}</td>`).join('')}</tr>`).join(''))):`<div class="row between mb"><strong>今天 · 10 月 13 日</strong>${button('自选日期',"modal('选择用量日期',field('开始日期','2026-10-01','date')+'<div class=mt>'+field('结束日期','2026-10-13','date')+'</div><p class=\"small muted mt\">本次仅预览日期控件，不加载其他数据。</p>')")}</div><div class="grid3">${panel('调用次数','<strong class="num" style="font-size:27px">48</strong><p class="small muted">其中疑难升级 3 次</p>')}${panel('文本用量','<strong class="num" style="font-size:27px">82,400</strong><p class="small muted">tokens · 示例</p>')}${panel('图片用量','<strong class="num" style="font-size:27px">21</strong><p class="small muted">张 · 另有 1 次待确认</p>')}</div><div class="mt">${panel('按功能查看',`<div class="bargraph">${[['文案',100,18],['复核',100,18],['疑难',17,3],['类目',34,6],['图片',17,3]].map(([t,h,n])=>`<div style="height:${h}%"><span>${t} ${n}</span></div>`).join('')}</div><p class="small muted mt">按功能统计调用次数，合计 48 次；3 次图片调用产生 21 张示例图片，张数另计。</p><div class="divider"></div><div class="row between"><strong>估算费用（示例）</strong><span class="num">$ 1.28 + 1 项待确认</span></div><p class="small muted mt">非真实单价计算，不是账户余额或官方账单；缺少用量的请求不按零计费。</p>`)}</div>`)}
function pricingSettings(){return panel('定价与组套促销',`<div class="form-grid">${field('结算汇率（示例）','7.1','number')}${field('每套头程费用（¥）','2.0','number')}${field('每套包装费用（¥）','0.5','number')}${field('ROI 须大于（示例）','30%')}${field('售价上限（USD）','9.99','number')}${field('最低可行价加价（USD）','0.50','number')}</div><details class="mt"><summary>平台扣费、配送费档位与抛重</summary><p class="small muted mt">按已确认业务口径展示费率、单位与来源，不新增定价算法。</p></details><div class="divider"></div><div class="form-grid">${field('组套候选件数','2, 3, 4')}${field('每 SKU 默认备货套数','10','number')}${field('促销开始日期（示例时区）','2026-10-15','date')}${field('促销结束日期','2026-10-22','date')}</div><div class="mt">${note('这里只管理规则，不提供独立试算工具','实际报价、成本和不合格原因在对应销售 SKU / 草稿中查看。')}</div>`)+savebar('保存定价与组套规则')}
function backupSettings(){return panel('本地数据',`<div class="price-list"><div><span>工作区</span><span class="mono">HTC / 示例工作区</span></div><div><span>商品 / 原图与生成图</span><span>128 个 / 2.4 GB（示例）</span></div><div><span>标签与单据</span><span>86 MB（示例）</span></div><div><span>临时缓存</span><span>120 MB（示例）</span></div></div><div class="row mt">${button('打开数据目录',"notify('此处打开本地目录；预览不访问真实目录。')")}${button('预览可清理内容',"cleanupDemo()")}</div>`)+`<div class="mt">${panel('加密备份与恢复',`<div class="form-grid">${field('备份口令（预览不保存）','','password','placeholder="输入口令" autocomplete="off"')}${field('确认口令','','password','placeholder="再次输入" autocomplete="off"')}</div><div class="row mt">${button('创建完整备份',"backupDemo()",'primary')}${button('从备份恢复',"restoreDemo()")}</div><p class="small muted mt">完整备份包含恢复所需记录与文件；仅数据库快照不能当作完整备份。凭据与普通数据分开。</p>`)}</div>`}
function backupDemo(){modal('创建完整工作区备份',`<div class="checkline"><span>数据库与业务历史</span>${pill('包含','good')}</div><div class="checkline"><span>被引用的图片、标签、单据</span>${pill('包含','good')}</div><div class="checkline"><span>授权密钥</span>${pill('不包含','neutral')}</div><p class="small muted mt">这是范围确认示例，不读取真实数据、不生成备份。</p>`,button('关闭',"closeDialog()")+button('模拟校验完成',"closeDialog();notify('备份流程已演示，未创建真实备份。')",'primary'))}
function restoreDemo(){modal('恢复前核对',`<p>示例备份时间：2026-10-12 18:00</p><div class="notice warn mt"><div><strong>将替换本地业务资料</strong><p>实际恢复前需确认安全时点和文件完整性。后续已发生的调用、预算、身份与未知提交保护不能清零。</p></div></div><p class="small muted mt">恢复后不自动启动任务；连接需要重新核对。本预览不执行任何恢复。</p>`,button('取消',"closeDialog()")+button('查看恢复后说明',"closeDialog();notify('恢复后说明：核对连接、查看任务状态、明确继续。没有恢复真实数据。')",'danger'))}
function cleanupDemo(){modal('清理范围预览',table(['类别','空间','处理方式'],`<tr><td>临时预览缓存</td><td>120 MB</td><td>可重建（示例）</td></tr><tr><td>任务引用的图片</td><td>2.4 GB</td><td>受保护</td></tr><tr><td>尚无保留期限的记录</td><td>待统计</td><td>本轮不自行删除</td></tr>`)+`<p class="small muted mt">这份预览不会删除文件。具体保留期限在最终方案确认。</p>`,button('关闭',"closeDialog()"))}
function diagnosticDemo(){$('diagnosticResult').innerHTML=note('示例检查：2 项正常，1 项需查看','目录可读、历史记录可解析；1 张候选图下载未完成，可返回原图位继续。','warn')+`<div class="mt">${button('查看关联图片步骤',"openSku(4)",'link')}</div>`}
document.addEventListener('keydown',e=>{if(e.key==='Tab')document.body.classList.add('keyboard')});document.addEventListener('pointerdown',()=>document.body.classList.remove('keyboard'));
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
render();
</script>
</body>
</html>
