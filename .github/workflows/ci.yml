name: CI

on:
  push:
    branches: [main, '2.5.0版本更新的内容', 'integration/htc-250-parallel']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: node --test --test-concurrency=4 --test-timeout=180000 tests/*.test.ts
      - run: npm run build
