const $=s=>document.querySelector(s);function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3500)}
function navigate(v){view=v;filter='all';query='';stateFilter='';render();window.scrollTo(0,0)}
function renderNav(){$('#mainnav').innerHTML=navs.slice(0,7).map(navbutton).join('');$('#adminnav').innerHTML=navs.slice(7).map(navbutton).join('');$('#crumb').textContent=navs.find(n=>n[0]===view)?.[1]||'控件规范'}
function navbutton(n){return `<button onclick="navigate('${n[0]}')" class="${view===n[0]?'active':''}" ${view===n[0]?'aria-current="page"':''} aria-label="${n[1]}" title="${n[1]}">${icon(n[2])}<span>${n[1]}</span>${n[3]?`<span class="count">${n[3]}</span>`:''}</button>`}
function heading(title,sub,actions=''){return `<div class="heading"><div><h1>${title}</h1><p class="muted small">${sub}</p></div><div class="actions">${actions}</div></div>`}
function searchbox(placeholder='搜索商品名称、SKU 或异常原因'){return `<label class="search">${icon('search')}<input id="search" type="search" placeholder="${placeholder}" aria-label="${placeholder}" oninput="query=this.value;renderProducts()"></label>`}
function automatic(){return `${heading('自动上架','按商品管理任务，按 SKU 跟进进度与异常。',`<button onclick="openRules()">${icon('settings')}执行规则</button><button onclick="openInbox()">${icon('plus')}从采集箱添加</button>`)}
<section class="panel"><div class="setup"><label class="field">目标店铺 / 站点<select id="target" onchange="toast('已切换演示目标；预览不会连接店铺')"><option>Haul 演示店铺 · 美国站</option></select></label><label class="field">图片托管<select><option>演示图片空间 · 已配置</option></select></label><div><div class="small muted" style="margin-bottom:8px">执行设置</div><div class="small">每个 SKU 备货 <strong>10 套</strong><span style="margin:0 9px;color:#c7ced8">|</span>每 SKU <strong>7 张图</strong></div></div><button onclick="openConnections()">${icon('check')}检查连接</button></div><div class="setup-footer"><span><span class="dot"></span> 演示连接已就绪 <span style="margin:0 10px;color:#ccd3dc">/</span> 文案复核已开启 · 图片风险检测已开启</span><button class="link small" onclick="openConnections()" style="min-height:22px">查看连接详情</button></div></section>
<div class="notice" role="note">${icon('alert')}<div class="notice-text"><strong>3 件商品需要处理</strong><small>1 件系统待修复 · 1 件待补资料 · 1 件结果未知。其他商品可独立继续。</small></div><button onclick="setFilter('attention')">查看待处理</button></div>
<div class="stats"><div class="stat"><b>8</b><span>来源商品</span></div><div class="stat"><b>20</b><span>销售 SKU</span></div><div class="stat"><b id="runstat">2</b><span>处理中 SKU</span></div><div class="stat success"><b>5</b><span>已完成 SKU</span></div><div class="stat error"><b>3</b><span>需处理 SKU</span></div><div class="stat"><b>3</b><span>待回读 SKU</span></div></div>
<section class="panel"><div class="listtop" role="tablist" aria-label="商品分类" id="tabs"></div><div class="toolbar">${searchbox()}<select aria-label="按执行阶段筛选" onchange="stateFilter=this.value;renderProducts()"><option value="">全部执行阶段</option><option value="图片生成">图片生成</option><option value="资料">资料与来源图</option><option value="提交">提交与回读</option><option value="等待启动">等待启动</option></select><button class="link small right" onclick="toggleAll()" id="expandall">展开全部</button><button class="small" onclick="refreshPreview()">${icon('refresh')}刷新</button></div><div class="listarea"><div class="tablehead"><input type="checkbox" id="selectall" aria-label="选择当前筛选下可启动的商品" onchange="selectAll(this.checked)"><span>商品 / 来源</span><span>销售 SKU</span><span>执行阶段</span><span>状态与处理原因</span><span style="text-align:right">操作</span></div><div class="products" id="products"></div></div><div class="listfoot"><span id="resultcount"></span><span>商品展开后显示各 SKU · 所有示例均在本页</span></div></section><p class="design-note">预览说明：缩略图为商品示意图；按钮只演示本页交互，不执行真实发布或付费调用。</p>`}
const tabs=[['all','全部商品',8],['pending','待上架',5],['attention','需处理',3],['filtered','规则筛选',1],['done','已提交与完成',5]];
function setFilter(f){filter=f;renderProducts()}
function visible(){return products.filter(p=>{const tab=filter==='all'||filter==='attention'&&['error','input','unknown'].includes(p.state)||filter==='pending'&&p.states.some(s=>['ready','running','error','input','unknown'].includes(s))||filter==='filtered'&&p.state==='filtered'||filter==='done'&&p.states.some(s=>['done','readback'].includes(s));const q=query.trim().toLowerCase();const match=[p.title,p.id,p.reason,...p.sku,...p.sku.map((_,i)=>p.id+'-'+String(i+1).padStart(2,'0'))].join(' ').toLowerCase().includes(q);const stage=!stateFilter||stateFilter==='资料'&&['来源图准备','资料核对'].includes(p.stage)||stateFilter==='提交'&&['提交结果核对','等待平台回读'].includes(p.stage)||p.stage===stateFilter;return tab&&match&&stage})}
function canSelect(p){return p.states.includes('ready')}
function row(p){const open=expanded.has(p.id), eligible=p.states.filter(s=>s==='ready').length;return `<article class="product ${open?'open':''} ${selected.has(p.id)?'selected':''}"><div class="product-row"><input type="checkbox" aria-label="选择${p.title}" ${canSelect(p)?'':`disabled title="没有可启动的 SKU"`} ${selected.has(p.id)?'checked':''} onchange="selectProduct('${p.id}',this.checked)"><div class="identity">${art(p)}<div><div class="product-name">${p.title}</div><div class="meta">1688 · <span class="mono">${p.id}</span> · ${p.count} 个来源规格</div></div></div><div class="mono">${p.count}<div class="meta">${eligible?'可启动 '+eligible:'—'}</div></div><div class="stage">${p.state==='running'&&paused?'已暂停调度':p.stage}${p.progress>0&&p.state!=='done'?`<div class="bar"><i style="width:${p.progress}%"></i></div>`:''}</div><div>${badge(p.state)}<div class="reason ${p.state==='error'?'red':''}">${p.reason}</div></div><div class="rowaction"><button class="link" onclick="openProduct('${p.id}')">${['error','input'].includes(p.state)?'处理异常':p.state==='unknown'?'核对结果':'查看详情'}</button><button class="link muted" aria-expanded="${open}" onclick="toggleProduct('${p.id}')">${open?'收起':'展开'} ${icon('down')}</button></div></div>${open?details(p):''}</article>`}
function details(p){return `<div class="details"><div class="detail-title"><strong>销售 SKU 明细 <span style="margin-left:12px;font-weight:400">${p.count} 个规格 · 各规格独立处理</span></strong><span class="mono">来源 ${p.id} / ${p.id==='P001'?'父 SKU：HTC-MAT-01':'父体关系待核对'}</span></div><table><thead><tr><th>规格 / 销售 SKU</th><th>文案</th><th>图片</th><th>状态</th><th>下一步</th></tr></thead><tbody>${p.sku.map((s,i)=>{let state=p.states[i];return `<tr><td><strong style="font-weight:500">${s}</strong><div class="meta mono">${p.id}-${String(i+1).padStart(2,'0')}</div></td><td>${['done','running','readback','unknown'].includes(state)?'<span class="ok">✓ 已准备</span>':'待准备'}</td><td><span class="mono">${state==='done'||state==='readback'||state==='unknown'?'7 / 7':state==='running'?'4 / 7':'0 / 7'}</span>${state==='running'?'<span class="meta"> · 生成中</span>':''}</td><td>${badge(state)}</td><td><button class="link" onclick="openProduct('${p.id}',${i})">${state==='unknown'?'先核对提交结果':state==='error'?'查看失败原因':state==='input'?'补充来源尺寸':state==='done'?'查看成果':state==='filtered'?'查看筛选原因':'查看执行详情'}</button></td></tr>`}).join('')}</tbody></table><div class="detail-footer">已生成并通过检查的图片会保留。异常仅影响对应 SKU；结果未知时先核对，不直接重发。</div></div>`}
function renderProducts(){if(!$('#products'))return;const ps=visible();$('#tabs').innerHTML=tabs.map(t=>`<button role="tab" aria-selected="${filter===t[0]}" class="tab ${filter===t[0]?'active':''}" onclick="setFilter('${t[0]}')">${t[1]} <span>${t[2]}</span></button>`).join('');$('#products').innerHTML=ps.length?ps.map(row).join(''):'<div class="empty"><h3>没有匹配的商品</h3><p>试试其他关键词，或清除筛选条件。</p><button style="margin-top:16px" onclick="clearFilters()">清除筛选</button></div>';$('#resultcount').textContent=`显示 ${ps.length} / 8 件商品 · ${ps.reduce((n,p)=>n+p.count,0)} 个销售 SKU`;
const eligible=ps.filter(canSelect),checked=eligible.filter(p=>selected.has(p.id));$('#selectall').checked=!!eligible.length&&checked.length===eligible.length;$('#selectall').indeterminate=checked.length>0&&checked.length<eligible.length;$('#selectall').disabled=!eligible.length;$('#expandall').textContent=ps.length&&ps.every(p=>expanded.has(p.id))?'收起全部':'展开全部';renderBatch()}
function clearFilters(){filter='all';query='';stateFilter='';$('#search').value='';$('.toolbar select').value='';renderProducts()}
function selectProduct(id,on){on?selected.add(id):selected.delete(id);renderProducts()}
function selectAll(on){visible().filter(canSelect).forEach(p=>on?selected.add(p.id):selected.delete(p.id));renderProducts()}
function toggleProduct(id){expanded.has(id)?expanded.delete(id):expanded.add(id);renderProducts()}
function toggleAll(){const ps=visible(),all=ps.every(p=>expanded.has(p.id));ps.forEach(p=>all?expanded.delete(p.id):expanded.add(p.id));renderProducts()}
function renderBatch(){let ps=products.filter(p=>selected.has(p.id)),sku=ps.reduce((n,p)=>n+p.states.filter(s=>s==='ready').length,0);$('#batch').innerHTML=view==='automatic'?`<div class="batch"><strong>已选 <span style="color:var(--blue)">${ps.length}</span> 件商品</strong><span class="muted small">可启动 ${sku} 个 SKU${ps.length?' · 包含其他状态的规格自动跳过':''}</span>${ps.length?'<button class="link small" onclick="selected.clear();renderProducts()">清空选择</button>':''}<span class="spacer"></span><button onclick="pauseTask()">${paused?'继续任务':'暂停任务'}</button><span title="${sku?'仅演示确认流程':'请先勾选包含待执行 SKU 的商品'}"><button class="primary" ${sku?'':'disabled'} onclick="startPreview()">${icon('play')}启动自动上架${sku?' ('+sku+')':''}</button></span></div>`:''}
function refreshPreview(){const b=$('.toolbar button:last-child');b.disabled=true;b.textContent='读取中…';setTimeout(()=>{b.disabled=false;b.innerHTML=icon('refresh')+'刷新';toast('示例任务已刷新；没有连接业务服务')},450)}
function confirmBox(title,body,label,fn){$('#confirmbody').innerHTML=`<h2>${title}</h2>${body}`;$('#confirmyes').textContent=label;$('#confirmyes').onclick=()=>{$('#confirm').close();fn()};$('#confirm').showModal()}
function startPreview(){let ps=products.filter(p=>selected.has(p.id)),n=ps.reduce((a,p)=>a+p.states.filter(s=>s==='ready').length,0);confirmBox('确认本次执行范围',`<p class="muted">${ps.length} 件来源商品 · ${n} 个待执行 SKU</p><div class="keyvalue"><span>目标</span>Haul 演示店铺 · 美国站</div><div class="keyvalue"><span>备货计划</span>每 SKU 10 套</div><p class="small muted" style="margin-top:16px">正式软件启动后会调用文案、图片和检测服务，并按授权提交。此次为设计预览，只演示确认反馈。</p>`,'模拟启动',()=>toast(`模拟确认成功：${n} 个 SKU。示例状态保持不变。`))}
function pauseTask(){confirmBox(paused?'继续任务':'暂停任务调度',`<p class="muted">${paused?'从可继续的步骤恢复，已完成成果保留。':'停止调度后续步骤；已发出的请求仍需等待结果或核对，不能视为已经取消。'}</p><p class="small muted" style="margin-top:12px">此操作仅改变预览中的暂停状态。</p>`,paused?'模拟继续':'模拟暂停',()=>{paused=!paused;renderProducts();toast(paused?'已模拟暂停后续调度':'已模拟恢复任务调度')})}
function drawer(title,html,footer='<button onclick="closeDrawer()">关闭</button>'){lastFocus=document.activeElement;$('#overlay').innerHTML=`<div class="drawerback" onclick="if(event.target===this)closeDrawer()"><section class="drawer" role="dialog" aria-modal="true" aria-label="${title}"><div class="drawerhead"><h2>${title}</h2><button aria-label="关闭详情" onclick="closeDrawer()">${icon('close')}</button></div><div class="drawerbody">${html}</div><div class="drawerfooter">${footer}</div></section></div>`;document.body.style.overflow='hidden';$('.drawerhead button').focus()}
function closeDrawer(){$('#overlay').innerHTML='';document.body.style.overflow='';lastFocus?.focus()}
function openProduct(id,idx){const p=products.find(p=>p.id===id),s=idx===undefined?p.state:p.states[idx];const problem={error:['来源参考图下载失败','米白色 / 大号的来源图片未能下载。本次该 SKU 停在来源准备阶段；其他规格和已完成图片均保留。','检查来源图片地址，确认图片可访问后，再从失败步骤继续。'],input:['缺少可靠尺寸来源','M 码缺少胸围尺寸依据，当前未填入猜测值，也未生成尺寸图。','补充来源尺寸图或在手动上架中录入可核实的尺寸。'],unknown:['提交结果未知','请求已发出，但尚未收到明确结果。现在无法判断平台是否已接受提交。','先核对平台记录与本地回读结果；未确认之前不重新提交。'],filtered:['未达到当前 ROI 规则','演示预计 ROI 为 18%，低于演示规则阈值 30%。资料与历史成果保留。','检查成本和定价依据；资料或规则变化后可重新评估。']};drawer('商品执行详情',`<div class="identity">${art(p)}<div><strong>${p.title}</strong><div class="meta mono">${p.id}${idx===undefined?'':'-'+String(idx+1).padStart(2,'0')}</div>${badge(s)}</div></div>${problem[s]?`<div class="notice" style="${s!=='error'?'background:var(--amber-bg);border-color:#e8d3af;color:var(--amber)':''}">${icon('alert')}<div><strong>${problem[s][0]}</strong><p class="small" style="margin-top:8px">${problem[s][1]}</p></div></div><h3>下一步怎么处理</h3><p class="small muted">${problem[s][2]}</p>`:`<h3>当前进度</h3><p class="muted small">${s==='readback'?'平台已接受提交，正在等待读回；接受提交不等于已可售。':s==='done'?'建档与标签步骤已完成。':'任务按 SKU 独立推进，已完成的步骤与图片保留。'}</p>`}<h3>执行信息</h3><div class="keyvalue"><span>目标店铺</span>Haul 演示店铺 · 美国站</div><div class="keyvalue"><span>范围</span>${idx===undefined?p.count+' 个销售 SKU':p.sku[idx]}</div><div class="keyvalue"><span>图片成果</span>${s==='done'||s==='unknown'||s==='readback'?'7 张已通过检查，保留':'仅继续未完成步骤'}</div><div class="keyvalue"><span>最近更新</span>2026-10-11 14:32</div><h3>处理记录</h3><p class="small muted mono">14:32　保存当前任务状态<br>14:30　核对来源资料与执行条件<br>14:28　创建任务</p>`, `<button onclick="closeDrawer()">关闭</button>${s==='unknown'?'<button class="primary" onclick="toast(\'演示核对：当前仍无明确结果，继续保持结果未知\')">核对平台结果</button>':s==='error'||s==='input'?`<button class="primary" onclick="closeDrawer();navigate('manual')">进入手动处理</button>`:s==='done'?`<button class="primary" onclick="closeDrawer();navigate('shipping')">查看备货与标签</button>`:s==='filtered'?'<button onclick="toast(\'演示重新评估：当前成本与规则未变，仍未达到阈值\')">重新评估</button>':''}`)}
function openRules(){drawer('执行规则',`<p class="muted small">以下是用于评审排版的示例规则。</p><div class="stack" style="margin-top:20px"><label class="field">每件商品最多纳入的来源规格<input type="number" value="4" min="1"></label><label class="field">每个销售 SKU 计划备货套数<input type="number" value="10" min="1"></label><label class="field">最低预计 ROI（%）<input type="number" value="30" min="0"></label><div class="keyvalue"><span>每个 SKU 图片数量</span>7 张</div><p class="small muted">所有来源规格完整保留。未知提交结果不会因修改规则而自动重发；现有任务的执行范围不随此处变化。</p></div>`,'<button onclick="closeDrawer()">关闭</button><button class="primary" onclick="toast(\'已演示保存反馈；示例规则不持久化\');closeDrawer()">演示保存</button>')}
function openConnections(){drawer('连接与执行条件',`<p class="muted small">均为演示状态，没有访问真实连接或凭据。</p>${['目标店铺 · 美国站','文案与图片规划','文案独立复核','图片生成','首图文字检查','图片风险检测','图片托管'].map(t=>`<div class="keyvalue"><span>${t}</span><span class="ok">✓ 演示就绪</span></div>`).join('')}<h3>检查范围</h3><p class="small muted">所有图片检查侵权风险；仅第一张主图检查文字。已通过图片保留，主图文字问题按原有重试限制处理。</p>`, '<button onclick="closeDrawer()">关闭</button><button class="primary" onclick="toast(\'演示连接检查完成：7 项就绪\')">重新检查</button>')}
function openInbox(){drawer('从采集箱添加商品',`<p class="muted small" style="margin-bottom:20px">勾选商品后加入自动上架。此处仅展示添加交互。</p>${products.slice(4,7).map(p=>`<label class="identity" style="padding:15px 0;border-bottom:1px solid var(--line)"><input type="checkbox" class="importcheck">${art(p)}<span>${p.title}<span class="meta" style="display:block">${p.count} 个来源规格 · 资料已采集</span></span></label>`).join('')}`,'<button onclick="closeDrawer()">取消</button><button class="primary" onclick="let n=document.querySelectorAll(\'.importcheck:checked\').length;if(!n){toast(\'请先选择商品\');return}closeDrawer();toast(\'已演示添加 \'+n+\' 件商品；当前列表保留原始样例\')">添加所选商品</button>')}
function simpleTable(headers,rows){return `<div class="panel" style="overflow:auto"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function productcell(p){return `<div class="identity">${art(p)}<div><strong style="font-weight:550">${p.title}</strong><div class="meta mono">${p.id} · 1688</div></div></div>`}
function openImport(){drawer("导入商品链接",`<label class="field">1688 商品链接<textarea rows="6" placeholder="每行一条商品链接"></textarea></label>`,`<button onclick="closeDrawer()">取消</button><button class="primary" onclick="toast(&quot;仅预览导入流程，不采集远程商品&quot;)">模拟导入</button>`)}
function inboxPage(){return heading("采集箱","来源商品先集中整理，再选择上架方式。",`<button class="primary" onclick="openImport()">${icon("plus")}导入商品</button>`)+`<div class="toolbar panel" style="margin-bottom:16px"><strong>来源商品</strong><span class="muted small">显示 8 个示例</span><button class="right" onclick="navigate(&quot;automatic&quot;)">进入自动上架</button></div>`+simpleTable(["商品","来源规格","资料状态","采集时间","操作"],products.map(p=>[productcell(p),p.count+" 个",badge(p.state==="input"?"input":"ready"),"今天 14:20",`<button class="link" onclick="openProduct(&quot;${p.id}&quot;)">查看资料</button>`]))}

let manualTab=0;function manualPage(){return heading('手动上架','按步骤补齐资料，明确问题后再继续。',`<button onclick="toast('演示草稿保存成功；不会写入业务数据')">保存草稿</button><button class="primary" onclick="toast('示例校验：M 码仍缺少胸围尺寸来源')">检查资料</button>`)+`<div class="two-col"><section class="panel"><div class="steps">${['基本资料','规格与尺寸','图片','上架检查'].map((t,i)=>`<button class="link ${manualTab===i?'active':''}" onclick="manualTab=${i};render()">${i+1}. ${t}</button>`).join('')}</div><div class="padded">${manualTab===0?`<div class="formgrid"><label class="field full">商品名称<input value="宠物胸背牵引套装 · 透气网布可调节"></label><label class="field">商品类目<select><option>宠物用品 / 胸背与牵引</option></select></label><label class="field">品牌<input placeholder="来源未提供，请核实后填写"></label><label class="field full">商品描述<textarea rows="7">透气网布胸背与牵引绳套装，可调节绑带。尺寸信息以来源商品资料为准。</textarea></label></div>`:manualTab===1?`<div class="notice">${icon('alert')}<div><strong>M 码缺少胸围尺寸依据</strong><small>补充来源资料后再填写，不使用猜测值。</small></div></div>${simpleTable(['规格','胸围（cm）','依据'],[['雾蓝色 / S','30–36','来源尺寸图'],['雾蓝色 / M','<input aria-label="M码胸围" placeholder="待补充">','<span style="color:var(--red)">缺少来源</span>'],['浅粉色 / L','44–52','来源尺寸图']])}`:manualTab===2?`<h3>来源参考图</h3><div class="gallery">${[1,2,3,4].map(()=>art(products[2])).join('')}</div><p class="design-note">示意缩略图 · 视觉关联待确认，下载成功不代表匹配正确。</p>`:`<h3>发布前检查</h3>${['基本资料：待核对品牌','尺寸资料：M 码待补充','图片：视觉关联待确认','提交：尚未开始'].map(t=>`<div class="keyvalue">${t}</div>`).join('')}<button disabled style="margin-top:20px" title="先补齐资料并完成检查">提交上架</button>`}</div></section><aside class="panel padded"><div class="identity">${art(products[2])}<strong>当前商品</strong></div><h3 style="margin-top:20px">宠物胸背牵引套装</h3><p class="small muted">来源 P003 · 3 个规格</p><div class="keyvalue"><span>整体状态</span>${badge('input')}</div><h3 style="margin-top:20px">需要处理</h3><p class="small" style="color:var(--red)">补充 M 码胸围来源。</p><p class="small muted" style="margin-top:8px">其他规格的资料与图片继续保留。</p></aside></div>`}
function resultsPage(){return heading('上架进度','区分已提交、待回读与可售状态。')+`<div class="notice" style="background:var(--amber-bg);border-color:#e8d3af;color:var(--amber)">${icon('alert')}<div>1 个 SKU 提交结果未知，需要先核对。平台接受提交不等于已可售。</div></div>`+simpleTable(['商品','SKU','提交状态','平台状态','操作'],[products[3],products[7],products[5]].map(p=>[productcell(p),p.count+' 个',badge(p.state),'待平台确认',`<button class="link" onclick="openProduct('${p.id}')">查看回读</button>`]))}
function dataPage(){return heading('商品数据','跟踪由本工作台正式上传的商品；以下为模拟数据。')+simpleTable(['商品','店铺 / 站点','可售状态','销量（示例）','库存（示例）','操作'],[products[5],products[0]].map((p,i)=>[productcell(p),'Haul 演示店铺 / US','<span class="badge green">可售（模拟）</span>',i?12:28,i?80:120,`<button class="link" onclick="openProduct('${p.id}')">查看详情</button>`]))}
function procurementPage(){return heading('采购备货','按销售单位核对采购数量与来源商品。',`<button onclick="downloadExample()">下载示例备货单</button>`)+simpleTable(['商品','销售规格','备货套数','每套件数','采购件数','来源'],[products[5],products[0]].map(p=>[productcell(p),p.sku[0],'<input aria-label="备货套数" type="number" value="10" min="1" style="width:80px" oninput="this.closest(\'tr\').querySelector(\'.pieces\').textContent=(Number(this.value)*5)||0">','5','<span class="pieces mono">50</span>','1688 · 示例来源']))+`<p class="design-note">数量修改仅作用于预览。示例下载文件不包含真实采购链接。</p>`}
function openLabel(){drawer("标签预览",`<h3>超细纤维清洁布 · 蓝灰色 / 5 件装</h3><div class="panel padded"><p class="mono">DEMO-P006-01</p><p class="muted small">设计占位标签 · 不可用于实际履约</p></div>`)}
function shippingPage(){return heading("发货与标签","先核对备货单，再查看商品标签与货件。")+simpleTable(["备货单","商品","标签状态","货件状态","操作"],[["STOCK-20261011-01",productcell(products[5]),`<span class="badge green">标签已准备</span>`,"未创建货件",`<button class="link" onclick="openLabel()">查看标签</button>`]])}

function openCatalog(name){drawer("类目资料",`<h3>${name}</h3><p class="muted small">此处演示类目资料展开方式。正式字段以店铺当前 Schema 为准。</p><div class="keyvalue">商品名称</div><div class="keyvalue">材质与颜色</div><div class="keyvalue">规格及包装数量</div>`)}
function catalogPage(){return heading("上架类目库","查看本地类目与必填资料。")+simpleTable(["类目","类型代码","站点","本地资料","操作"],[["宠物胸背","ANIMAL_HARNESS","美国站","已下载"],["厨房隔热垫","TRIVET","美国站","已下载"],["清洁布","CLEANING_CLOTH","美国站","已下载"]].map(r=>[...r,`<button class="link" onclick="openCatalog(&quot;${r[0]}&quot;)">查看字段</button>`]))}

function auditPage(){return heading('操作记录','重要操作与处理结果集中查看。')+simpleTable(['时间','操作','对象','结果'],[['14:32:18','保存任务状态','自动上架任务 AT-001','<span class="badge green">已保存</span>'],['14:31:05','核对提交结果','P004-01','<span class="badge amber">结果未知</span>'],['14:30:42','下载来源图片','P002-01','<span class="badge red">下载失败</span>'],['14:29:16','保存图片成果','P001-01','<span class="badge green">7 张图已保留</span>'],['14:28:02','创建自动任务','8 件来源商品','<span class="badge blue">已创建</span>']])}
function settingsPage(){return heading('设置','统一管理工作台连接、规则与外观。')+`<div class="settings-tabs"><button class="primary" onclick="openConnections()">连接状态</button><button onclick="openRules()">商品与定价规则</button><button onclick="navigate('components')">查看控件规范</button></div><div class="two-col"><section class="panel padded"><h2 class="sectionline">全局服务连接</h2>${['Amazon 店铺','文案与独立复核','图片生成与检测','图片托管'].map(t=>`<div class="keyvalue"><span>${t}</span><span class="ok">演示已配置</span><button class="link" onclick="openConnections()">查看</button></div>`).join('')}</section><aside class="panel padded"><h2 class="sectionline">外观方案</h2><div class="keyvalue"><span>风格</span>平面 / 浅色</div><div class="keyvalue"><span>控件圆角</span>4 px</div><div class="keyvalue"><span>反馈动效</span>120 ms 颜色变化</div><div class="keyvalue"><span>字号</span>正文 14 / 列表 13</div></aside></div>`}
function componentsPage(){return heading('控件规范','4px 圆角 · 纯色背景 · 清晰边界与状态。')+`<div class="stack"><section class="panel padded"><h2 class="sectionline">按钮 · 常规高度 32px</h2><div class="actions"><button class="primary" onclick="toast('主操作反馈示例')">主要操作</button><button onclick="toast('次要操作反馈示例')">次要操作</button><button class="link" onclick="toast('文字操作反馈示例')">文字操作</button><button class="danger" onclick="confirmBox('危险操作确认','<p>此处只展示确认样式。</p>','确认示例',()=>toast('确认反馈示例'))">危险操作</button><button disabled title="需要先选择商品">禁用状态</button><button disabled>正在读取…</button></div></section><section class="panel padded"><h2 class="sectionline">业务状态 · 文字与颜色共同表达</h2><div class="actions">${Object.keys(definitions).map(badge).join('')}</div></section><section class="panel padded"><h2 class="sectionline">表单与校验</h2><div class="formgrid"><label class="field">商品名称<input placeholder="请输入商品名称"></label><label class="field">目标店铺<select><option>Haul 演示店铺 · 美国站</option></select></label><label class="field">缺失资料<input aria-invalid="true" aria-describedby="errorhint" style="border-color:var(--red)" placeholder="待补充可靠尺寸"><span id="errorhint" style="color:var(--red)">请补充尺寸来源，不填写估算值。</span></label><label class="field">只读资料<input readonly value="P003 · 来源编号"></label></div></section></div>`}
function downloadExample(){const blob=new Blob(['\ufeff商品,规格,备货套数,说明\n清洁布,蓝灰色5件装,10,仅为UI演示\n'],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='HTC-示例备货单.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已下载示例备货单')}
function render(){renderNav();const pages={automatic,inbox:inboxPage,manual:manualPage,results:resultsPage,data:dataPage,procurement:procurementPage,shipping:shippingPage,catalog:catalogPage,audit:auditPage,settings:settingsPage,components:componentsPage};$('#content').innerHTML=pages[view]();renderBatch();if(view==='automatic')renderProducts()}
document.addEventListener('keydown',e=>{if(!$('.drawer'))return;if(e.key==='Escape'){closeDrawer();return}if(e.key==='Tab'){const els=[...$('.drawer').querySelectorAll('button,input,select,textarea,[tabindex="0"]')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus()}}});render();
</script></body></html>
